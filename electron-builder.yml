appId: com.colo.iconchanger
productName: COLO
forceCodeSigning: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/colocolo.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
portable:
  artifactName: COLO.exe
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - main.cjs
  - preload.cjs
  - assets/**/*
  - package.json
  - node_modules/rcedit/**/*
  - "!src/**/*"
  - "!public/**/*"
  - "!*.yml"
  - "!*.md"
  - "!.git"
  - "!.npmrc"
asarUnpack:
  - node_modules/rcedit/**/*
asar: true
compression: maximum
extraResources:
  - from: assets
    to: assets
